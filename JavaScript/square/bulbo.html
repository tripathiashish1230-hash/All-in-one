<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Bulb</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Center + animated gradient */
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(270deg, green, yellow, purple, orange, grey);
            background-size: 1000% 1000%;
            animation: gradientMove 8s ease infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* bulb */
        img {
            width: 120px;
            transition: 0.4s;
        }

        /* glow when ON */
        .on {
            filter: drop-shadow(0 0 25px yellow);
            transform: scale(1.08);
        }

        /* buttons */
        button {
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif">

        <div>
            <button onclick="bulbOff()">bulb off</button>
            <button onclick="bulbOn()">bulb on</button>
        </div>
    </div>

    <script>
        const bulb = document.getElementById("bulb");

        function bulbOn() {
            bulb.src = "https://www.w3schools.com/js/pic_bulbon.gif";
            bulb.classList.add("on");
        }

        function bulbOff() {
            bulb.src = "https://www.w3schools.com/js/pic_bulboff.gif";
            bulb.classList.remove("on");
        }
    </script>

</body>

</html>
