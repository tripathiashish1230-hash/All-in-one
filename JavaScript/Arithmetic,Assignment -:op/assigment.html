<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 50px;
            background-color: purple;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>
        Assigment Operatores
    </h1>
    <script>
        // value
        document.write("value=30");
        document.write("<br>");
        document.write("value=2");
        document.write("<br>");
        // x **= y
        let x = 30;
        let y = 2;
        x **= y;
        document.write(x, " " + "x **= y");
        document.write("<br>");
        // 	x += y
        let x1 = 30;
        let y1 = 2;
        x1 += y1;
        document.write(x1, " " + "x += y");
        document.write("<br>");
        // 	x -= y
        let x2 = 30;
        let y2 = 2;
        x2 -= y2;
        document.write(x2, " " + "	x -= y");
        document.write("<br>");
        // 	x /= y
        let x3 = 30;
        let y3 = 2;
        x3 /= y3;
        document.write(x3, " " + "	x /= y");
        document.write("<br>");
        // 	x *= y
        let x4 = 30;
        let y4 = 2;
        x4 *= y4;
        document.write(x4, " " + "	x *= y");
        document.write("<br>");
        // 	x %= y
        let x5 = 30;
        let y5 = 2;
        x5 %= y5;
        document.write(x4, " " + "	x %= y");
        document.write("<br>");

    </script>
</body>

</html>
