<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 50px;
            background-color: red;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>
        Arithmetic operators
    </h1>
    <script>
        let x = 30;
        let y = 2;
        let a = x ** y;
        let b = x + y;
        let c = x - y;
        let d = x / y;
        let e = x * y;
        let f = x % y;
        let g = x++;
        let h = x--;
        document.write("value=30");
        document.write("<br>");
        document.write("value=2");
        document.write("<br>");
        document.write(a, " " + "Exponentiation (ES2016)");
        document.write("<br>");
        document.write(b, " " + "Addition");
        document.write("<br>");
        document.write(c, " " + "Subtraction");
        document.write("<br>");
        document.write(d, " " + "Division");
        document.write("<br>");
        document.write(e, " " + "Multiplication");
        document.write("<br>");
        document.write(f, " " + "Modulus (Remainder)");
        document.write("<br>");
        document.write(g, " " + "Increment");
        document.write("<br>");
        document.write(h, " " + "Decrement");
    </script>
</body>

</html>
