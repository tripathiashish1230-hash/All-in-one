<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 210, 86, 0.24), transparent 28%),
                radial-gradient(circle at 80% 15%, rgba(69, 179, 224, 0.25), transparent 30%),
                linear-gradient(135deg, #111827, #18233a 50%, #0f172a);
            color: #f8fafc;
            font-family: Arial, Helvetica, sans-serif;
        }

        .clock-card {
            width: min(92vw, 430px);
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.68);
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(16px);
            text-align: center;
        }

        .clock {
            position: relative;
            width: min(72vw, 310px);
            aspect-ratio: 1;
            margin: 0 auto 24px;
            border: 10px solid #f8fafc;
            border-radius: 50%;
            background:
                radial-gradient(circle, #ffffff 0 5px, transparent 6px),
                radial-gradient(circle, #e2e8f0, #cbd5e1);
            box-shadow:
                inset 0 0 24px rgba(15, 23, 42, 0.28),
                0 18px 38px rgba(0, 0, 0, 0.28);
        }

        .number {
            position: absolute;
            inset: 12px;
            color: #0f172a;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            transform: rotate(calc(30deg * var(--i)));
        }

        .number span {
            display: inline-block;
            transform: rotate(calc(-30deg * var(--i)));
        }

        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            border-radius: 999px;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg);
        }

        .hour {
            width: 8px;
            height: 26%;
            background: #0f172a;
        }

        .minute {
            width: 5px;
            height: 35%;
            background: #2563eb;
        }

        .second {
            width: 3px;
            height: 40%;
            background: #ef4444;
        }

        .center-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 18px;
            height: 18px;
            border: 4px solid #f8fafc;
            border-radius: 50%;
            background: #ef4444;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.2);
        }

        .digital-time {
            min-height: 52px;
            font-size: clamp(2rem, 9vw, 3.3rem);
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .date {
            margin-top: 10px;
            color: #cbd5e1;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <main class="clock-card">
        <div class="clock" aria-label="Analog clock">
            <div class="number" style="--i: 1"><span>1</span></div>
            <div class="number" style="--i: 2"><span>2</span></div>
            <div class="number" style="--i: 3"><span>3</span></div>
            <div class="number" style="--i: 4"><span>4</span></div>
            <div class="number" style="--i: 5"><span>5</span></div>
            <div class="number" style="--i: 6"><span>6</span></div>
            <div class="number" style="--i: 7"><span>7</span></div>
            <div class="number" style="--i: 8"><span>8</span></div>
            <div class="number" style="--i: 9"><span>9</span></div>
            <div class="number" style="--i: 10"><span>10</span></div>
            <div class="number" style="--i: 11"><span>11</span></div>
            <div class="number" style="--i: 12"><span>12</span></div>

            <div class="hand hour" id="hourHand"></div>
            <div class="hand minute" id="minuteHand"></div>
            <div class="hand second" id="secondHand"></div>
            <div class="center-dot"></div>
        </div>

        <div class="digital-time" id="digitalTime">00:00:00</div>
        <p class="date" id="dateText">Loading date...</p>
    </main>

    <script>
        const hourHand = document.getElementById("hourHand");
        const minuteHand = document.getElementById("minuteHand");
        const secondHand = document.getElementById("secondHand");
        const digitalTime = document.getElementById("digitalTime");
        const dateText = document.getElementById("dateText");

        function addZero(value) {
            return value.toString().padStart(2, "0");
        }

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const hourDegrees = (hours % 12) * 30 + minutes * 0.5;
            const minuteDegrees = minutes * 6 + seconds * 0.1;
            const secondDegrees = seconds * 6;

            hourHand.style.transform = `translateX(-50%) rotate(${hourDegrees}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${minuteDegrees}deg)`;
            secondHand.style.transform = `translateX(-50%) rotate(${secondDegrees}deg)`;

            digitalTime.textContent = `${addZero(hours)}:${addZero(minutes)}:${addZero(seconds)}`;
            dateText.textContent = now.toLocaleDateString("en-IN", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>

</html>
