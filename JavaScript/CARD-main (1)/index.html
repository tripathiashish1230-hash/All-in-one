<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="test.css">
    <link rel="shortcut icon" href="/photo/favicon.png" type="image/x-icon">
    <title>Registration Form</title>
</head>

<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="photo/vikash.mp4" type="video/mp4">
    </video>
    <div class="vk">
        <div class="maindiv">
            <form class="from">
                <h1>User Registration Form</h1>

                <div class="flex">
                    <div class="type">
                        <label for="FirstName">First Name</label>
                        <input type="text" id="FirstName" placeholder="First Name" title="Please fill First Name">
                        <p class="error"></p>
                    </div>
                    <div class="type2">
                        <label for="LastName">Last Name</label>
                        <input type="text" id="LastName" placeholder="Last Name" title="Please fill Last Name">
                        <p class="error"></p>
                    </div>
                </div>

                <div class="flex">
                    <div class="type">
                        <label for="Gmail">Gmail</label>
                        <input type="email" id="Gmail" placeholder="Gmail" title="Please fill Email">
                        <p class="error"></p>
                    </div>
                    <div class="type2 ">
                        <label for="Password">Password</label>
                        <input type="password" id="Password" placeholder="Password" title="Please fill password">
                        <p class="error"></p>
                    </div>
                </div>

                <div class="submit1">
                    <input id="button" type="submit" class="submit">
                </div>

                <table>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Gmail</th>
                        <th>Password</th>
                        <th>Action</th>
                    </tr>
                    <tbody id="tableBody"></tbody>
                </table>
            </form>
        </div>
    </div>
    <!-- <script src="test.js"></script> -->

    <script src="scrpt.js"></script>

    <!-- if (!validation()) return; -->
    <!-- <script src="test111111.js"></script> -->
</body>

</html>
