<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            /* margin: 0px; */
            padding: 0px;
        }
    </style>
</head>

<body>
    <h1 style="background-color: red;">for</h1>

    <script>
        for (let x = 0; x <= 10; x++) {
            document.write(x, "<br>");
        }

    </script>
    <h2>while</h2>
    <script>
        let i = 1;

        while (i <= 5) {
            document.write(i, "<br>");
            i++;
        }
    </script>
</body>

</html>
