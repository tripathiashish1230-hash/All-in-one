<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            padding: 0px;
            margin: 0px;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="button"] {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <script>
        function pick(val) {
            document.getElementById("a").value += val;
        }
        function solve() {
            let x = document.getElementById("a").value;
            let y = eval(x);
            document.getElementById("a").value = y;
        }
        function clean() {
            document.getElementById("a").value = "";
        }
        function del() {
            let x = document.getElementById("a").value;
            document.getElementById("a").value = x.slice(0, -1);
        }
        function sol() {
            let x = document.getElementById("a").value;
            x = x.replace(/(\d+(\.\d+)?)%/g, "($1/100)");
            let y = eval(x);
            document.getElementById("a").value = y;
        }
    </script>
    <div>
        <table>
            <tr>
                <td colspan="4"><input type="text" id="a"></td>

            </tr>
            <tr>
                <td><input type="button" value="AC" onclick=" clean() "></td>
                <td><input type="button" value="Del" onclick=" del()"></td>
                <td><input type="button" value="%" onclick="pick('%')"></td>
                <td><input type="button" value="/" onclick="pick('/')"></td>
            </tr>
            <tr>
                <td><input type="button" value="1" onclick="pick(1)"></td>
                <td><input type="button" value="2" onclick="pick(2)"></td>
                <td><input type="button" value="3" onclick="pick(3)"></td>
                <td><input type="button" value="+" onclick="pick('+')"></td>
            </tr>
            <tr>
                <td><input type="button" value="4" onclick="pick(4)"></td>
                <td><input type="button" value="5" onclick="pick(5)"></td>
                <td><input type="button" value="6" onclick="pick(6)"></td>
                <td><input type="button" value="-" onclick="pick('-')"></td>
            </tr>
            <tr>
                <td><input type="button" value="7" onclick="pick(7)"></td>
                <td><input type="button" value="8" onclick="pick(8)"></td>
                <td><input type="button" value="9" onclick="pick(9)"></td>
                <td><input type="button" value="*" onclick="pick('*')"></td>
            </tr>
            <tr>
                <td><input type="button" value="00" onclick="pick('00')"></td>
                <td><input type="button" value="0" onclick="pick(0)"></td>
                <td><input type="button" value="." onclick="pick('.')"></td>
                <td><input type="button" value="=" onclick="solve()"></td>
            </tr>
        </table>
    </div>
</body>

</html>
