<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        h1 {
            background-color: aqua;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>If else</h1>
    <p id="demo"></p>
    <p id="demo1"></p>
    <script>
        // if eles
        const hour = new Date().getHours();
        let wish = "";
        if (hour <= 10) {
            wish = "Good Morning";
        } else if (hour <= 20) {
            wish = "Good evening";
        } else {
            wish = "Good Night";
        }

        document.getElementById("demo").innerHTML = wish;
        // Ternary
        let tea = 10;
        let isMember = false;
        let discount = isMember ? 0.2 : 0;
        let total = 10 - (tea * discount)
        document.getElementById("demo1").innerHTML = "Tea price is " + total;
    </script>
</body>

</html>
