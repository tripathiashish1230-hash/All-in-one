	<!DOCTYPE>
	<html>
	<head>
	<title>form contact</title>
	</head>
	<body>
	
               <h1 style="text-align:center">contact</h1>

               <form>
                      <label for="firstname"
                       style="margin-left:150px";>
                       First name:
                       </label>
                      <br>
                     <input type="text"
                      required placeholder="username"
                      style="width:50% ; margin-left:150px";
                      name="firstname"
                      id="firstname"
                     >
                     <br><br>
                     <label for="Last name"
                      style="margin-left:150px">
                      Last name:
                      </label>
                     <br>
                     <input type="text"
                      required
                      placeholder="title"
                      style="width:50% ; margin-left:150px";
                      name="lastname"
                      id="Last name"
                      >
                     <br><br>
                     <label for="Phone number"
                      style="margin-left:150px";>
                      Phone number:
                      </label>
                     <br>
                     <input type="number"
                      required
                      placeholder="PH-no"
                      style="width:50% ; margin-left:150px";
                      name="phone number"
                      id="Phone number"
                      >
                     <br><br>
                     <label style="margin-left:150px";>Date & time</label>
                     <br><br>
                    <label for="Day" style="margin-left:150px";>Day:</label>                    
                    <label for="Month" style="margin-left:135px";>Month:</label>
                    <label for="Year" style="margin-left:170px";>Year:</label>
                    <label for="Time" style="margin-left:80px";>Time:</label>                                          
                     <br>
                    <input type="number"
                     required placeholder="day"
                     style="width:10% ;margin-left:150px";
                     name="date"
                     id="Day"
                     >
                    <input type="text"
                     required
                     placeholder="month"
                     style="width:15% ;margin-left:27px";
                     name="month"
                     id="Month">
                    <input type="number"
                     required
                     placeholder="year"
                     style="width:7% ;margin-left:20px";
                     name="year"
                     id="Year">
                    <input type="time"
                     required
                     style="width:10% ;margin-left:20px";
                     name="time"
                     id="Time">
                    <br><br>
                    <label style="margin-left:150px";>
                    Seating preference:
                    </label>
                    <br><br>
                    <input type="radio"
                     required
                     name="place"
                     style="margin-left:150px";
                     id="indoor"
                     value="Indoor">
                    <label for="indoor"
                     style="margin-left:30px"
                     >
                     Indoor
                     </label>
                    <br>
                    <input type="radio"
                     required
                     name="place"
                     style="margin-left:150px";
                     id="outdoor"
                     value="Outdoor"
                     >
                    <label for="outdoor"
                    style="margin-left:30px">
                    Outdoor
                    </label >
                    <br><br>
                    <label for="add-req"
                     style="margin-left:150px">
                     Additional requests:
                     </label>
                    <br><br>
                    <input type="text"
                    required
                    placeholder="additionl requests"
                    style="margin-left:150px; width:50%; height:33px"
                    name="additional requests"
                    id="add-req"
                    >
                    <br><br>
                    <input id="cb"
                    required type="checkbox"
                    style="margin-left:150px";
                    >
                    <label for="cb">
                    Yes,subscribe me to your newsletter.
                    </label>
                    <br><br>
                    <input type="submit"
                     value="Request booking"
                     style="margin-left:150px; width:50% ; background-color:black ;color:white; height:26;"
                     >
                    
                    
                    
                     
                     

              </form>

	</body>
	</html>
